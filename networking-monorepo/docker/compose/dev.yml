include:
  - infra.kafka.yml
  - infra.postgres.yml
  - infra.qdrant.yml
  - infra.mongodb.yml

services:
  # anchor, x- means extension field so this service gets ignored by execution
  x-java-service: &java-service
    build:
      context: ../..
      dockerfile: ../dev/java-service.Dockerfile

    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle

    command: ./gradlew bootRun --continuous

  idp-service:
    # <<: *java-service means inherit all properties from anchor
    <<: *java-service
    profiles: [ "idp" ]
    working_dir: /workspace/nm-idp-service
    ports:
      - "8081:8080"

  workspace-manager:
    <<: *java-service
    profiles: [ "workspace" ]
    working_dir: /workspace/nm-workspace-manager
    ports:
      - "8082:8080"

  code-indexing:
    <<: *java-service
    profiles: [ "code-indexing" ]
    working_dir: /workspace/nm-code-indexing
    ports:
      - "8083:8080"

  gitops:
    <<: *java-service
    profiles: [ "gitops" ]
    working_dir: /workspace/nm-gitops
    ports:
      - "8084:8080"

  llm-broker:
    <<: *java-service
    profiles: [ "llm-broker" ]
    working_dir: /workspace/nm-llm-broker
    ports:
      - "8085:8080"

  api-gateway:
    <<: *java-service
    profiles: [ "api-gateway" ]
    working_dir: /workspace/nm-api-gateway
    ports:
      - "8085:8080"

volumes:
  gradle-cache: