services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=tu_password_fuerte
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    restart: always

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=tu_password_fuerte
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=webadmin # Usuario para entrar a la web
      - ME_CONFIG_BASICAUTH_PASSWORD=webpass  # Pass para entrar a la web
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb-data: