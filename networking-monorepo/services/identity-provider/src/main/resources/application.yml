server:
  port: 8081

spring:
  application:
    name: nm-idp-service
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${GATEWAY_BASE_URL:http://localhost:8080}/api/idp/login/oauth2/code/google

app:
  gateway-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:4321}

auth:
  session:
    absolute-ttl: 8h

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
