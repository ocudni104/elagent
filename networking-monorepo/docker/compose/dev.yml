include:
  - infra.consul.yml
  - infra.kafka.yml
  - infra.postgres.yml
  - infra.qdrant.yml
  - infra.mongodb.yml

x-java-service: &java-service
  build:
    context: ../..
    dockerfile: docker/dev/java-service.dev.Dockerfile
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  environment:
    CONSUL_HOST: consul
    CONSUL_PORT: 8500
    GRADLE_USER_HOME: /tmp/gradle-home
  volumes:
    - ../..:/workspace
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  frontend:
    container_name: frontend
    profiles: [ "frontend", "dev" ]
    env_file:
      - .env
    build:
      context: ../..
      dockerfile: docker/dev/frontend.dev.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}

    working_dir: /workspace/frontend

    volumes:
      - ../../frontend:/workspace/frontend
      - pnpm-store:/home/app/.pnpm

    command: sh -c "pnpm install && pnpm dev -- --host"

    ports:
      - "4321:4321"

    environment:
      NODE_ENV: development
      CI: "true"
      PUBLIC_BACKEND_URL: http://localhost:8086
      INTERNAL_BACKEND_URL: http://gateway:8080

  identity-provider:
    container_name: identity-provider
    # <<: *java-service means inherit all properties from anchor
    <<: *java-service
    profiles: [ "identity-provider", "dev" ]
    ports:
      - "8081:8081"
      - "5001:5005"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GATEWAY_BASE_URL: http://localhost:8086
      FRONTEND_BASE_URL: http://localhost:4321/app
      APP_SECURITY_ISSUER_URI: http://identity-provider:8081
    command: sh -c "cd services/identity-provider && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

  app-service:
    container_name: app-service
    <<: *java-service
    profiles: [ "app-service", "dev" ]
    ports:
      - "8082:8080"
      - "5002:5005"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      IDP_ISSUER_URI: http://identity-provider:8081
    command: sh -c "cd services/app-service && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

  channel-service:
    container_name: channel-service
    <<: *java-service
    profiles: [ "channel-service", "dev" ]
    ports:
      - "8083:8080"
      - "5003:5005"
    command: sh -c "cd services/channel-service && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

  insights-service:
    container_name: insights-service
    <<: *java-service
    profiles: [ "insights-service", "dev" ]
    ports:
      - "8084:8080"
      - "5004:5005"
    command: sh -c "cd services/insights-service && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

  ai-layer:
    container_name: ai-layer
    <<: *java-service
    profiles: [ "ai-layer", "dev" ]
    ports:
      - "8085:8080"
      - "5005:5005"
    command: sh -c "cd services/ai-layer && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

  gateway:
    container_name: gateway
    <<: *java-service
    profiles: [ "gateway", "dev" ]
    ports:
      - "8086:8080"
      - "5006:5005"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      IDP_ISSUER_URI: http://identity-provider:8081
    command: sh -c "cd services/gateway && ./gradlew --project-cache-dir /tmp/gradle-project-cache bootRunInContainer"

volumes:
  pnpm-store:
